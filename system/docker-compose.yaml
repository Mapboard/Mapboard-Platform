services:
  gateway:
    # Reverse proxy
    image: "caddy:2"
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MAPBOARD_API_ADDRESS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    labels:
      - dev.orbstack.domains=mapboard.local,dev.mapboard.local
  database:
    image: ${POSTGRES_IMAGE:-postgis/postgis:15-3.4}
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_DB
      # This allows connections without a password, which is expedient but insecure...
      - POSTGRES_PASSWORD
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGPORT=5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${MAPBOARD_DB_PORT:-54398}:5432"
    expose:
      - 5432
    volumes:
      - db_cluster:/var/lib/postgresql/data
  postgrest:
    image: "postgrest/postgrest:latest"
    restart: unless-stopped
    depends_on:
      - database
    environment:
      - PGRST_DB_URI=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - PGRST_DB_SCHEMA=mapboard_api
      - PGRST_DB_ANON_ROLE=web_anon
      # The session token issued by the platform API is also PostgREST's JWT
      - PGRST_JWT_SECRET=${SECRET_KEY:-local-development-secret-key-not-for-deployment}
      - PGRST_JWT_AUD=mapboard
  elevation_tiler:
    image: elevation-tiler:v0.1.0
    restart: unless-stopped
    command: [ "fastapi", "run", "--root-path", "/dem-tiles", "elevation_tiler" ]
    volumes:
      - ../data:/data
  mapboard_server:
    build: ${MAPBOARD_SERVER_SRC_DIR}
    image: mapboard-server
    restart: unless-stopped
    profiles:
      - production
    depends_on:
      - database
    environment:
      - MAPBOARD_DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - LOG_LEVEL=info
      # Verifies the platform API's session tokens; without it every request is allowed
      - SECRET_KEY=${SECRET_KEY:-local-development-secret-key-not-for-deployment}
  frontend:
    build: ../mapboard-ui
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - VITE_MAPBOARD_API_DOMAIN=https://mapboard.local
      - VITE_MAPBOX_TOKEN=${MAPBOX_TOKEN}
      # Don't fail on self-signed certificates (which OrbStack provides)
      - NODE_TLS_REJECT_UNAUTHORIZED=0
  # Sign-in (issues the session token that mapboard_server and PostgREST verify) and task runs
  api: &platform
    build:
      context: ..
    image: mapboard-platform
    restart: unless-stopped
    depends_on:
      - database
      - broker
    environment:
      - MAPBOARD_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://broker:6379/0
      - SECRET_KEY=${SECRET_KEY:-local-development-secret-key-not-for-deployment}
      # Sign-in is off until an ORCID client is configured
      - OAUTH_CLIENT_ID
      - OAUTH_CLIENT_SECRET
      - REDIRECT_URI=${REDIRECT_URI:-https://mapboard.local/api/auth/callback}
  # Runs topology rebuilds one at a time, each in a fresh process
  worker:
    <<: *platform
    command:
      - celery
      - -A
      - mapboard.tasks.app
      - worker
      - -Q
      - topology
      - --concurrency=1
      - --max-tasks-per-child=1
      - --loglevel=info
  # Task queue only; run state lives in mapboard.task_run
  broker:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
volumes:
  db_cluster:


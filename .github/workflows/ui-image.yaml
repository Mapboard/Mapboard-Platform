name: Mapboard UI image
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "mapboard-ui/**"
      - ".github/workflows/ui-image.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mapboard/mapboard-platform/ui

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Timestamped tags give Flux image automation an ordering to follow.
          tags: |
            type=raw,value=sha-{{sha}}
            type=ref,event=branch
            type=ref,event=branch,suffix=-{{date 'YYYYMMDDHHmmss'}}
            type=semver,pattern={{version}}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mapboard-ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image is built for one deployment: its API domain is fixed in the bundle.
          build-args: |
            VITE_MAPBOARD_API_DOMAIN=${{ vars.MAPBOARD_API_DOMAIN || 'https://mapboard.svc.macrostrat.org' }}
            VITE_MAPBOX_TOKEN=${{ vars.MAPBOX_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

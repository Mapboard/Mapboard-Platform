[project]
name = "mapboard-platform"
version = "1.0.0"
description = "A platform for creating geologic maps"
authors = [{ name = "Daven Quinn", email = "code@davenquinn.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mapboard.cli",
    "mapboard.topology-manager",
    "mapboard.tasks",
    "mapboard.core",
    "mapboard.cross-sections",
    "mapboard.api",
    "setuptools>=75.8.2,<76",
]

[dependency-groups]
dev = ["pytest>=8.3.5,<9"]

[tool.uv]
package = false
default-groups = "all"

[tool.uv.sources]
"mapboard.cli" = { path = "./py-modules/cli", editable = true }
"mapboard.topology-manager" = { path = "./py-modules/topology-manager", editable = true }
"mapboard.tasks" = { path = "./py-modules/tasks", editable = true }
"mapboard.core" = { path = "./py-modules/core", editable = true }
"mapboard.cross-sections" = { path = "./py-modules/cross-sections", editable = true }
"mapboard.api" = { path = "./py-modules/api", editable = true }

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

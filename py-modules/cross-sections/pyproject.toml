[project]
name = "mapboard.cross-sections"
version = "0.1.0"
description = "Tools to aid the construction of cross sections"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.9,<0.10",
    "macrostrat.database>=3.4.0,<4",
    "mapboard.core",
]

[tool.uv.sources]
"mapboard.core" = { path = "../core", editable = true }

[tool.uv.build-backend]
module-name = ["mapboard"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

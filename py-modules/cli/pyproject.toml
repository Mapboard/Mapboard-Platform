[project]
name = "mapboard.cli"
version = "0.1.0"
description = "A command-line application to control the Mapboard system"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.1.3,<9",
    "macrostrat.app_frame>=3.2.0,<4",
    "macrostrat.schema_management>=2.0.0,<3",
    "macrostrat.database>=4.0.0,<5",
    "macrostrat.dinosaur>=4.2.0,<5",
    "macrostrat.utils>=1.2.1,<2",
    "mapboard.topology-manager",
    "mapboard.cross-sections",
    "mapboard.core",
    "mapboard.tasks",
    "mapboard.api",
    "pytest>=8.3.5,<9",
    "python-daemon>=3.0.1,<4",
    "zeroconf>=0.56.0,<0.57",
    "ipython>=8.14.0,<9",
    "rich>=14,<16",
    "geopandas>=0.14.4,<0.15",
]

[project.scripts]
mapboard = "mapboard.cli:app"

[dependency-groups]
dev = ["black>=24.3.0,<25"]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["mapboard"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

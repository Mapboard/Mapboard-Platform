[project]
name = "mapboard.cli"
version = "0.1.0"
description = "A command-line application to control the Mapboard system"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.1.3,<9",
    "macrostrat.app_frame>=1.2.3,<2",
    "macrostrat.database>=3.4.0,<4",
    "macrostrat.dinosaur>=3.1.1,<4",
    "macrostrat.utils>=1.2.1,<2",
    "mapboard.topology-manager",
    "mapboard.cross-sections",
    "mapboard.core",
    "mapboard.tasks",
    "pytest>=8.3.5,<9",
    "python-daemon>=3.0.1,<4",
    "zeroconf>=0.56.0,<0.57",
    "ipython>=8.14.0,<9",
    "migra>=3.0.1647431138,<4",
    "rich>=13.4.2,<14",
    "geopandas>=0.14.4,<0.15",
]

[project.scripts]
mapboard = "mapboard.cli:app"

[dependency-groups]
dev = ["black>=23.3.0,<24"]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
"mapboard.topology-manager" = { path = "../topology-manager", editable = true }
"mapboard.cross-sections" = { path = "../cross-sections", editable = true }
"mapboard.core" = { path = "../core", editable = true }
"mapboard.tasks" = { path = "../tasks", editable = true }

[tool.uv.build-backend]
module-name = ["mapboard"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

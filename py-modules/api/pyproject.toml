[project]
name = "mapboard.api"
version = "1.0.0"
description = "API for Mapboard"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115,<0.137",
    "uvicorn>=0.30,<1",
    "macrostrat.auth_system>=1.2.0,<2",
    "macrostrat.task_runner>=0.1.0,<0.2",
    "macrostrat.database>=4.0.0,<5",
    "mapboard.core",
    "mapboard.tasks",
]

[tool.uv.build-backend]
module-name = ["mapboard"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

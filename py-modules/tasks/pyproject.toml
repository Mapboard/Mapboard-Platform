[project]
name = "mapboard.tasks"
version = "1.0.0"
description = "Runner for Mapboard tasks"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mapboard.core",
    "mapboard.topology-manager",
]

[tool.uv.sources]
"mapboard.core" = { path = "../core", editable = true }
"mapboard.topology-manager" = { path = "../topology-manager", editable = true }

[tool.uv.build-backend]
module-name = ["mapboard"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

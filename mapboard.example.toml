# Copy to mapboard.toml at the repository root (it is gitignored).
# Any setting can also be given as MAPBOARD_<KEY>, e.g. MAPBOARD_DATABASE.
# Choose an environment with `mapboard env <name>` or `--env <name>`; with
# neither, `local` is used.
#
# A value may name a secret instead of holding one: op:// (1Password), env://,
# file:// or keychain://. It is fetched only when a command connects.

op_account = "uw-madison.1password.com"

[local]
env_class = "local"
# Without `database`, the local stack's URL is built from .env (POSTGRES_*).

[development]
env_class = "development"

# Schema commands connect as the cluster's superuser and apply changes as
# `schema_owner`, so what they create is owned as the services expect.
schema_owner = "mapboard"

# `database` is a URL, or a table when the stored credential names a host we
# can't reach (the operator's Secret names the in-cluster one).
[development.database]
host = "db.development.svc.macrostrat.org"
user = "mapboard"
dbname = "mapboard"
# 1Password copy of the operator Secret k8s/macrostrat-dev/development-macrostrat-pguser-mapboard.
password = "op://Macrostrat admin/3yc43uoeqnqxkzdww3czqhaylq/Secret data/password"

[development.schema_database]
host = "db.development.svc.macrostrat.org"
user = "macrostrat-admin"
dbname = "mapboard"
# 1Password copy of the operator Secret k8s/macrostrat-dev/development-macrostrat-pguser-macrostrat-admin.
password = "op://Macrostrat admin/uw7xpvvph5yllk42wf3nbs4gla/Secret data/password"
